<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Shop - Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Shop</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Get in Touch</h2>
    <p>Have questions or custom inquiries? Reach out to us using any of the methods below:</p>
    <ul>
      <li>Email: <a href="edwardkenneth.nunag@tup.edu.ph">edwardkenneth.nunag@tup.edu.ph</a></li>
      <li>Phone: +63 993 244 6476</li>
      <li>Location: Manila, Philippines</li>
    </ul>

    <form>
      <fieldset>
        <legend>Your details</legend>

        <p>
          <label for="name">Name</label><br>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="email">Email</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="subject">Subject</label><br>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>-- Select an option --</option>
            <option value="product-question">Product Question</option>
            <option value="order-status">Order Status</option>
            <option value="wholesale-enquiry">Wholesale Enquiry</option>
            <option value="something-else">Something Else</option>
          </select>
        </p>

        <p>
          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="5" required></textarea>
        </p>

        <button type="submit">Send message</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>© 2026 My Shop. All rights reserved.</p>
  </footer>

</body>
</html>
