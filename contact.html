<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Kenneth's Tech Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Kenneth's Tech Shop</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <section>
      <h2>Get in Touch</h2>
      <p>Have questions about an order or need hardware recommendations? Send us a message or email us directly at <strong>knunag213@gmail.com</strong>.</p>
    </section>

    <section>
      <h2>Send a Message</h2>
      <form action="#" method="post">
        
        <p>
          <label for="name">Your Name:</label><br>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </p>

        <br>

        <p>
          <label for="email">Your Email:</label><br>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </p>

        <br>

        <p>
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        </p>

        <br>

        <p>
          <button type="submit">Send Message</button>
        </p>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Kenneth's Tech Shop. All rights reserved.</p>
  </footer>

</body>
</html>
